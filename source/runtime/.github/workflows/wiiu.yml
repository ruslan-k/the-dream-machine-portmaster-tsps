name: Build – Wii U

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'targets/powerpc-nintendo-wiiu.json'
      - 'platform/wiiu/**'
      - '.github/workflows/wiiu.yml'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-wiiu:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install Wii U libs (wut)
        run: dkp-pacman -Sy --noconfirm wiiu-dev wiiu-sdl2

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wiiu-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: wiiu-cargo-

      - name: Build RPX
        env:
          DEVKITPRO: /opt/devkitpro
        run: bash scripts/build_wiiu.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruffle4consoles-wiiu
          path: |
            target/powerpc-nintendo-wiiu/wiiu/ruffle4consoles.rpx
            platform/wiiu/meta.xml
          if-no-files-found: warn
